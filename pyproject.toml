[project]
name = "namefinder"
version = "0.1.0"
description = "Find a coined brand name: idea-first generation, LLM tournament ranking, domain and trademark screening."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["naming", "branding", "llm", "plackett-luce", "rdap", "trademark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "wordfreq>=3.1.1",
    "nltk>=3.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "numpy>=1.26",
]

[project.scripts]
namefinder = "namefinder.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["namefinder*"]
